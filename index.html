<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายการภาพยนตร์ 20 เรื่อง</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f1016;
            color: #ffffff;
            padding: 40px 20px;
        }
        .header-title {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 30px;
            color: #00d2d3;
        }
        /* จัดเรียงแบบ Grid responsive */
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 25px;
            max-width: 1300px;
            margin: 0 auto;
        }
        /* ตัวการ์ดหนัง */
        .movie-card {
            background-color: #1e1f29;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .movie-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 20px rgba(0, 210, 211, 0.3);
        }
        .movie-card img {
            width: 100%;
            height: 270px;
            object-fit: cover;
            display: block;
        }
        .movie-title {
            padding: 12px 10px;
            font-size: 0.95rem;
            font-weight: 600;
            text-align: center;
            color: #f1f1f1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
